name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Composer install (auth + retry on GitHub API flakiness)
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          set -euo pipefail
          attempt=1
          max=4
          until docker run --rm \
            -e COMPOSER_AUTH \
            -v "$PWD":/app -w /app \
            composer:2 install --no-interaction --prefer-dist
          do
            if [ "$attempt" -ge "$max" ]; then
              echo "prefer-dist failed after ${max} attempts — last try with --prefer-source"
              docker run --rm \
                -e COMPOSER_AUTH \
                -v "$PWD":/app -w /app \
                composer:2 install --no-interaction --prefer-source
              break
            fi
            echo "composer install failed (attempt ${attempt}/${max}), retrying in 15s…"
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Test PHP 7.4
        run: |
          docker run --rm -v "$PWD":/app -w /app php:7.4-cli vendor/bin/phpunit
          docker run --rm -v "$PWD":/app -w /app php:7.4-cli vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=512M

      - name: Test PHP 8.3
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli vendor/bin/phpunit
